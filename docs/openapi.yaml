# =============================================================================
# WECTI - Rascunho do contrato de API
# =============================================================================
# Regras de negocio aplicadas neste contrato (resumo - confirmar com o time):
#   - Cancelamento de inscricao permitido até 1 dia antes do inicio do evento.
#   - Penalizacao (no-show) se o aluno NAO cancelou E NAO fez check-in.
#   - Certificado exige check-in + check-out + permanencia >= 75% da duracao
#     do evento (calculada a partir de data_hora_inicio/data_hora_fim).
#   - Pontos do evento sao definidos no proprio cadastro do evento.
#   - Pontuacao e acumulada dentro do periodo (semestre) e reinicia a cada
#     novo periodo cadastrado.
#   - Perfis: admin, professor, aluno. O app Android aceita login de admin
#     e professor (sem perfil "operador" separado).
#   - Pontos do evento so contam para o aluno quando os criterios do
#     certificado sao cumpridos (check-in + check-out + permanencia >= 75%).
#   - Penalidade de no-show: o aluno perde exatamente os pontos que aquele
#     evento valeria (mesmo valor do campo "pontos" do evento).
#   - Cadastro de aluno exige RGM (Registro Geral do Aluno) - identificador
#     academico da faculdade, numero de 8 digitos, unico por aluno.
# =============================================================================

openapi: 3.0.3

info:
  title: WECTI API
  description: >
    API central do sistema de controle de acesso a palestras e eventos.
    Tanto o site do aluno quanto o app Android do operador (professor/admin)
    consomem exclusivamente esta API - nenhum cliente acessa o banco direto.
    Este e um RASCUNHO inicial para alinhar o time antes da Fase 1; campos e
    regras podem mudar conforme o desenvolvimento avança.
  version: 0.1.0-draft

servers:
  - url: http://localhost:8080/v1
    description: Ambiente local de desenvolvimento
  - url: https://api.wecti.com.br/v1
    description: Produção (placeholder, ajustar quando definirem o domínio)

tags:
  - name: Auth
    description: Login dos três perfis (admin, professor, aluno)
  - name: Usuarios
  - name: Periodos
    description: Semestres - controlam a janela de acumulo de pontuação
  - name: Palestrantes
  - name: Eventos
  - name: Inscricoes
  - name: Checkins
    description: Endpoints usados pelo app Android na entrada/saída do evento
  - name: Certificados
  - name: Pontuacao

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário (aluno, professor ou admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          description: Credenciais inválidas

  # ---------------------------------------------------------------------
  # Usuarios
  # ---------------------------------------------------------------------
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista usuários (somente admin)
      parameters:
        - name: perfil
          in: query
          schema:
            $ref: '#/components/schemas/Perfil'
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
    post:
      tags: [Usuarios]
      summary: Cadastra aluno ou convidado avulso
      description: >
        Usado principalmente pelo app Android quando o operador (professor
        ou admin) precisa cadastrar alguém na hora, na porta do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoUsuario'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Retorna o usuário autenticado
      responses:
        '200':
          description: Dados do usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  # ---------------------------------------------------------------------
  # Periodos
  # ---------------------------------------------------------------------
  /periodos:
    get:
      tags: [Periodos]
      summary: Lista os períodos (semestres) cadastrados
      responses:
        '200':
          description: Lista de períodos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Periodo'
    post:
      tags: [Periodos]
      summary: Cria um novo período (somente admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPeriodo'
      responses:
        '201':
          description: Período criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'

  # ---------------------------------------------------------------------
  # Palestrantes
  # ---------------------------------------------------------------------
  /palestrantes:
    get:
      tags: [Palestrantes]
      summary: Lista palestrantes cadastrados
      responses:
        '200':
          description: Lista de palestrantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Palestrante'
    post:
      tags: [Palestrantes]
      summary: Cadastra um novo palestrante (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPalestrante'
      responses:
        '201':
          description: Palestrante criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palestrante'

  # ---------------------------------------------------------------------
  # Eventos
  # ---------------------------------------------------------------------
  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos
      parameters:
        - name: periodo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filtra por eventos futuros ou já encerrados
          schema:
            type: string
            enum: [futuros, encerrados]
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
    post:
      tags: [Eventos]
      summary: Cadastra um evento (admin ou professor)
      description: >
        A pontuação do evento é definida aqui, no cadastro (campo "pontos"),
        conforme decidido pelo time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEvento'
      responses:
        '201':
          description: Evento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'

  /eventos/{eventoId}:
    parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Eventos]
      summary: Detalha um evento
      responses:
        '200':
          description: Dados do evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
    put:
      tags: [Eventos]
      summary: Atualiza um evento (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEvento'
      responses:
        '200':
          description: Evento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
    delete:
      tags: [Eventos]
      summary: Cancela um evento (admin ou professor)
      responses:
        '204':
          description: Evento cancelado

  # ---------------------------------------------------------------------
  # Inscricoes
  # ---------------------------------------------------------------------
  /eventos/{eventoId}/inscricoes:
    parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Inscricoes]
      summary: Aluno se inscreve no evento
      description: >
        Ao criar a inscrição, o backend gera o qrcode_token e dispara o
        e-mail com o QR code para o aluno.
      responses:
        '201':
          description: Inscrição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscricao'
        '409':
          description: Aluno já inscrito ou evento sem vagas
    get:
      tags: [Inscricoes]
      summary: Lista inscritos no evento (admin ou professor)
      responses:
        '200':
          description: Lista de inscrições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscricao'

  /me/inscricoes:
    get:
      tags: [Inscricoes]
      summary: Lista as inscrições do aluno autenticado
      parameters:
        - name: status
          in: query
          description: Filtra entre eventos futuros e histórico
          schema:
            type: string
            enum: [futuros, historico]
      responses:
        '200':
          description: Lista de inscrições do aluno
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscricao'

  /inscricoes/{inscricaoId}:
    parameters:
      - name: inscricaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Inscricoes]
      summary: Detalha uma inscrição
      responses:
        '200':
          description: Dados da inscrição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscricao'
    delete:
      tags: [Inscricoes]
      summary: Cancela a inscrição
      description: >
        Só permitido até 1 dia antes do início do evento. Depois desse
        prazo, retorna 422 e a inscrição passa a contar como no-show se o
        aluno não fizer check-in.
      responses:
        '204':
          description: Inscrição cancelada
        '422':
          description: Prazo de cancelamento (1 dia antes do evento) já passou

  /inscricoes/{inscricaoId}/qrcode:
    parameters:
      - name: inscricaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Inscricoes]
      summary: Obtém o QR code da inscrição
      description: >
        Usado pelo site para exibir/baixar o QR code que já foi enviado
        por e-mail no momento da inscrição.
      responses:
        '200':
          description: Imagem do QR code
          content:
            image/png:
              schema:
                type: string
                format: binary
    post:
      tags: [Inscricoes]
      summary: Reenvia o QR code por e-mail
      responses:
        '202':
          description: E-mail de reenvio agendado

  # ---------------------------------------------------------------------
  # Checkins (consumido pelo app Android)
  # ---------------------------------------------------------------------
  /checkins:
    post:
      tags: [Checkins]
      summary: Registra a entrada do aluno no evento
      description: >
        Endpoint usado pelo app Android ao escanear o QR code na entrada.
        Recebe o qrcode_token e, se válido, cria o registro de check-in
        com o horário de entrada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrcode_token]
              properties:
                qrcode_token:
                  type: string
      responses:
        '201':
          description: Check-in registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
        '404':
          description: QR code inválido ou inscrição não encontrada
        '409':
          description: Check-in já realizado para esta inscrição

  /checkins/{checkinId}/checkout:
    parameters:
      - name: checkinId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkins]
      summary: Registra a saída do aluno no evento
      description: >
        Também usado pelo app Android, escaneando o QR code novamente na
        saída. Junto com a duração do evento, esse horário é usado para
        calcular o percentual de presença (mínimo de 75% para liberar
        certificado e pontuação).
      responses:
        '200':
          description: Check-out registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'

  # ---------------------------------------------------------------------
  # Certificados
  # ---------------------------------------------------------------------
  /inscricoes/{inscricaoId}/certificado:
    parameters:
      - name: inscricaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Certificados]
      summary: Emite ou baixa o certificado do evento
      description: >
        Só libera o PDF se a inscrição tiver check-in, check-out e
        permanência de pelo menos 75% da duração do evento.
      responses:
        '200':
          description: Certificado em PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          description: Critérios de presença ainda não cumpridos

  # ---------------------------------------------------------------------
  # Pontuacao
  # ---------------------------------------------------------------------
  /me/pontuacao:
    get:
      tags: [Pontuacao]
      summary: Pontuação do aluno autenticado
      parameters:
        - name: periodo_id
          in: query
          description: Se omitido, retorna o período atual
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumo de pontuação do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontuacaoPeriodo'

  /pontuacao/aluno/{alunoId}/periodo/{periodoId}:
    parameters:
      - name: alunoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: periodoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Pontuacao]
      summary: Pontuação de um aluno especifico em um período (somente admin ou professor)
      description: >
        Adicionado para o app Android/painel de admin consultarem a
        pontuação de qualquer aluno, sem depender do token do proprio
        aluno usado em /me/pontuacao.
      responses:
        '200':
          description: Resumo de pontuação do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontuacaoPeriodo'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Perfil:
      type: string
      # Documentado em maiusculas porque e assim que o Jackson serializa o
      # enum Java por padrao (Usuario.perfil, NovoUsuario.perfil e a claim
      # "perfil" do JWT) - o rascunho original documentava em minusculas,
      # mas nao era isso que a API implementada realmente devolvia/esperava.
      enum: [ADMIN, PROFESSOR, ALUNO]

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/Perfil'
        rgm:
          type: string
          pattern: '^\d{8}$'
          nullable: true
          description: >
            Registro Geral do Aluno (RGM) - identificador acadêmico da
            faculdade, com 8 dígitos. Obrigatório e único quando
            perfil = aluno; não se aplica a admin/professor.

    NovoUsuario:
      type: object
      required: [nome, email, perfil]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/Perfil'
        rgm:
          type: string
          pattern: '^\d{8}$'
          nullable: true
          description: >
            Obrigatório quando perfil = aluno. O OpenAPI puro não expressa
            "obrigatório somente se outro campo tiver determinado valor",
            então essa regra precisa ser validada no backend.

    Periodo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: "2026.1"
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date

    NovoPeriodo:
      type: object
      required: [nome, data_inicio, data_fim]
      properties:
        nome:
          type: string
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date

    Palestrante:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        bio:
          type: string

    NovoPalestrante:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        bio:
          type: string

    Evento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
        descricao:
          type: string
        periodo_id:
          type: string
          format: uuid
        local:
          type: string
        data_hora_inicio:
          type: string
          format: date-time
        data_hora_fim:
          type: string
          format: date-time
        pontos:
          type: integer
          description: >
            Pontos que o evento vale para quem cumpre os critérios de
            presença (check-in + check-out + 75% de permanência).
        palestrantes:
          type: array
          items:
            $ref: '#/components/schemas/Palestrante'

    NovoEvento:
      type: object
      required: [titulo, periodo_id, data_hora_inicio, data_hora_fim, pontos]
      properties:
        titulo:
          type: string
        descricao:
          type: string
        periodo_id:
          type: string
          format: uuid
        local:
          type: string
        data_hora_inicio:
          type: string
          format: date-time
        data_hora_fim:
          type: string
          format: date-time
        pontos:
          type: integer
        palestrante_ids:
          type: array
          items:
            type: string
            format: uuid

    Inscricao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aluno_id:
          type: string
          format: uuid
        evento_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ativa, cancelada]
        criada_em:
          type: string
          format: date-time
        cancelada_em:
          type: string
          format: date-time
          nullable: true
        checkin:
          $ref: '#/components/schemas/Checkin'
        certificado_disponivel:
          type: boolean

    Checkin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inscricao_id:
          type: string
          format: uuid
        entrada:
          type: string
          format: date-time
        saida:
          type: string
          format: date-time
          nullable: true
        percentual_presenca:
          type: number
          format: float
          description: Calculado quando há saída registrada

    PontuacaoPeriodo:
      type: object
      properties:
        periodo_id:
          type: string
          format: uuid
        periodo_nome:
          type: string
        pontos_total:
          type: integer
          description: >
            Soma dos pontos dos eventos com status "concluido", já
            descontados os pontos perdidos nos eventos com status
            "no_show" (mesmo valor de pontos do evento perdido).
        eventos:
          type: array
          items:
            type: object
            properties:
              evento_id:
                type: string
                format: uuid
              titulo:
                type: string
              pontos:
                type: integer
              status:
                type: string
                enum: [concluido, no_show, cancelado]
