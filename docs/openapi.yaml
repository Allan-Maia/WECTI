# =============================================================================
# WECTI - Rascunho do contrato de API
# =============================================================================
# Regras de negocio aplicadas neste contrato (resumo - confirmar com o time):
#   - Cancelamento de inscricao permitido até 1 dia antes do inicio do evento.
#   - Penalizacao (no-show) se o aluno NAO cancelou E NAO fez check-in.
#   - Certificado exige check-in + check-out + permanencia >= 75% da duracao
#     do evento (calculada a partir de data_hora_inicio/data_hora_fim).
#   - Pontos do evento sao definidos no proprio cadastro do evento.
#   - Pontuacao e acumulada dentro do periodo (semestre) e reinicia a cada
#     novo periodo cadastrado.
#   - Perfis: admin, professor, aluno (sem perfil "operador" separado).
#   - Nao ha app Android dedicado: admin/professor gera o QR code de
#     check-in/check-out pelo proprio site e o aluno confirma a propria
#     presenca escaneando com a camera do celular (Android ou iOS).
#   - Pontos do evento so contam para o aluno quando os criterios do
#     certificado sao cumpridos (check-in + check-out + permanencia >= 75%).
#   - Penalidade de no-show: o aluno perde exatamente os pontos que aquele
#     evento valeria (mesmo valor do campo "pontos" do evento).
#   - Cadastro de aluno exige RGM (Registro Geral do Aluno) - identificador
#     academico da faculdade, numero de 8 digitos, unico por aluno.
# =============================================================================

openapi: 3.0.3

info:
  title: WECTI API
  description: >
    API central do sistema de controle de acesso a palestras e eventos.
    O site (aluno e admin/professor) consome exclusivamente esta API -
    nenhum cliente acessa o banco direto. Nao ha app Android dedicado: o
    check-in/check-out é feito via QR code lido pela câmera nativa do
    celular do aluno. Este e um RASCUNHO inicial para alinhar o time
    antes da Fase 1; campos e regras podem mudar conforme o
    desenvolvimento avança.
  version: 0.1.0-draft

servers:
  - url: http://localhost:8080/v1
    description: Ambiente local de desenvolvimento
  - url: https://api.wecti.com.br/v1
    description: Produção (placeholder, ajustar quando definirem o domínio)

tags:
  - name: Auth
    description: Login dos três perfis (admin, professor, aluno)
  - name: Usuarios
  - name: Periodos
    description: Semestres - controlam a janela de acumulo de pontuação
  - name: Palestrantes
  - name: Eventos
  - name: Inscricoes
  - name: Checkins
    description: >
      Admin/professor gera um QR code por sessão (entrada e depois
      saída) e projeta na tela; o próprio aluno confirma a presença
      escaneando com a câmera do celular (Android ou iOS, sem app)
  - name: Certificados
  - name: Pontuacao

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário (aluno, professor ou admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          description: Credenciais inválidas

  /auth/registrar:
    post:
      tags: [Auth]
      summary: Cadastro público de aluno ("Primeiro acesso? Crie sua conta")
      description: >
        Sempre cria um usuário com perfil ALUNO - não existe campo
        "perfil" no corpo da requisição, então não tem como quem se
        autocadastra virar Professor ou Admin por essa via. Cadastro de
        Professor continua sendo feito só pelo Admin, em POST /usuarios.
        Já devolve token (igual ao login), pra entrar direto no sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha, rgm]
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
                  minLength: 6
                rgm:
                  type: string
                  pattern: '^\d{8}$'
                curso:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Dados inválidos (email malformado, RGM fora do formato, senha curta)
        '409':
          description: Já existe um usuário com este email ou RGM

  /auth/redefinir-senha:
    post:
      tags: [Auth]
      summary: "\"Esqueci minha senha\" - redefine sem link por email"
      description: >
        Sem token/link por email de propósito - não há servidor de email
        configurado no projeto, e o cliente confirmou que não precisa de
        autenticação extra. A identidade é confirmada com o RGM (se
        perfil = aluno) ou CPF (se perfil = professor) já cadastrados -
        batendo, a pessoa já define a senha nova na mesma chamada. Serve
        também pro Professor (sempre cadastrado pelo Admin com uma senha
        provisória que ninguém sabe) definir a primeira senha de verdade.
        Não cobre reset de conta Admin (sem RGM/CPF) - por design.
        Já devolve token (igual ao login), pra entrar direto no sistema.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, identificador, nova_senha]
              properties:
                email:
                  type: string
                  format: email
                identificador:
                  type: string
                  description: RGM (8 dígitos, aluno) ou CPF (11 dígitos, professor)
                nova_senha:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Dados inválidos (email malformado, senha curta)
        '401':
          description: Email + RGM/CPF não conferem com nenhum cadastro

  # ---------------------------------------------------------------------
  # Usuarios
  # ---------------------------------------------------------------------
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista usuários paginados (somente admin)
      description: >
        Paginado de propósito - a lista de usuários cresce muito quando o
        sistema é liberado pros alunos, devolver tudo de uma vez não
        escala. "busca" filtra por nome, email, RGM ou CPF (contém, sem
        diferenciar maiúsculas/minúsculas no nome/email).
      parameters:
        - name: perfil
          in: query
          schema:
            $ref: '#/components/schemas/Perfil'
        - name: busca
          in: query
          schema:
            type: string
        - name: page
          in: query
          description: Página (começando em 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  conteudo:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  pagina:
                    type: integer
                  tamanho:
                    type: integer
                  total_elementos:
                    type: integer
                  total_paginas:
                    type: integer
    post:
      tags: [Usuarios]
      summary: Cadastra aluno ou convidado avulso
      description: >
        Usado pelo admin/professor direto pelo site quando precisa
        cadastrar alguém na hora, na porta do evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoUsuario'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/{usuarioId}:
    parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Usuarios]
      summary: Atualiza um usuário (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoUsuario'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '409':
          description: Email ou RGM já usado por outro usuário
    delete:
      tags: [Usuarios]
      summary: Exclui um usuário (somente admin)
      responses:
        '204':
          description: Usuário excluído
        '422':
          description: Usuário possui inscrições e não pode ser excluído

  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Retorna o usuário autenticado
      responses:
        '200':
          description: Dados do usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  # ---------------------------------------------------------------------
  # Periodos
  # ---------------------------------------------------------------------
  /periodos:
    get:
      tags: [Periodos]
      summary: Lista os períodos (semestres) cadastrados
      responses:
        '200':
          description: Lista de períodos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Periodo'
    post:
      tags: [Periodos]
      summary: Cria um novo período (somente admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPeriodo'
      responses:
        '201':
          description: Período criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'

  # ---------------------------------------------------------------------
  # Palestrantes
  # ---------------------------------------------------------------------
  /palestrantes:
    get:
      tags: [Palestrantes]
      summary: Lista palestrantes cadastrados
      responses:
        '200':
          description: Lista de palestrantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Palestrante'
    post:
      tags: [Palestrantes]
      summary: Cadastra um novo palestrante (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPalestrante'
      responses:
        '201':
          description: Palestrante criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palestrante'

  # ---------------------------------------------------------------------
  # Eventos
  # ---------------------------------------------------------------------
  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos
      parameters:
        - name: periodo_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filtra por eventos futuros ou já encerrados
          schema:
            type: string
            enum: [futuros, encerrados]
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
    post:
      tags: [Eventos]
      summary: Cadastra um evento (admin ou professor)
      description: >
        A pontuação do evento é definida aqui, no cadastro (campo "pontos"),
        conforme decidido pelo time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEvento'
      responses:
        '201':
          description: Evento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'

  /eventos/{eventoId}:
    parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Eventos]
      summary: Detalha um evento
      responses:
        '200':
          description: Dados do evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
    put:
      tags: [Eventos]
      summary: Atualiza um evento (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoEvento'
      responses:
        '200':
          description: Evento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
    delete:
      tags: [Eventos]
      summary: Cancela um evento (admin ou professor)
      responses:
        '204':
          description: Evento cancelado

  # ---------------------------------------------------------------------
  # Inscricoes
  # ---------------------------------------------------------------------
  /eventos/{eventoId}/inscricoes:
    parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Inscricoes]
      summary: Aluno se inscreve no evento
      responses:
        '201':
          description: Inscrição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscricao'
        '409':
          description: Aluno já inscrito ou evento sem vagas
    get:
      tags: [Inscricoes]
      summary: Lista inscritos no evento (admin ou professor)
      responses:
        '200':
          description: Lista de inscrições
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscricao'

  /me/inscricoes:
    get:
      tags: [Inscricoes]
      summary: Lista as inscrições do aluno autenticado
      parameters:
        - name: status
          in: query
          description: Filtra entre eventos futuros e histórico
          schema:
            type: string
            enum: [futuros, historico]
      responses:
        '200':
          description: Lista de inscrições do aluno
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscricao'

  /inscricoes/{inscricaoId}:
    parameters:
      - name: inscricaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Inscricoes]
      summary: Detalha uma inscrição
      responses:
        '200':
          description: Dados da inscrição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscricao'
    delete:
      tags: [Inscricoes]
      summary: Cancela a inscrição
      description: >
        Só permitido até 1 dia antes do início do evento. Depois desse
        prazo, retorna 422 e a inscrição passa a contar como no-show se o
        aluno não fizer check-in.
      responses:
        '204':
          description: Inscrição cancelada
        '422':
          description: Prazo de cancelamento (1 dia antes do evento) já passou

  # ---------------------------------------------------------------------
  # Checkins - por SESSAO de evento (nao mais por aluno)
  # ---------------------------------------------------------------------
  # O QR code individual do aluno (gerado na inscricao, enviado por
  # e-mail) foi removido - nao ha mais app Android dedicado. Agora quem
  # gera o QR e o admin/professor, um por evento (tipo ENTRADA e depois
  # tipo SAIDA), projetado na tela pro publico. O aluno le com a camera
  # do proprio celular (Android ou iOS, sem precisar de app nenhum) - a
  # camera abre a URL embutida no QR direto no navegador, que chama
  # POST /checkin-sessoes/{sessaoId}/confirmar autenticado como aluno.
  /eventos/{eventoId}/checkin-sessoes:
    parameters:
      - name: eventoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkins]
      summary: Gera uma sessão de check-in/check-out pro evento (admin ou professor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaSessaoCheckin'
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoCheckin'

  /checkin-sessoes/{sessaoId}/qrcode:
    parameters:
      - name: sessaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Checkins]
      summary: Imagem do QR code da sessão, pra projetar na tela (admin ou professor)
      description: >
        O QR codifica a URL de confirmação
        (`<frontend>/checkin/confirmar/{sessaoId}`) - a camera do celular
        do aluno abre direto, sem precisar de app.
      responses:
        '200':
          description: Imagem do QR code
          content:
            image/png:
              schema:
                type: string
                format: binary
        '422':
          description: Sessão já expirada

  /checkin-sessoes/{sessaoId}/confirmar:
    parameters:
      - name: sessaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Checkins]
      summary: Aluno confirma a própria entrada/saída ao escanear o QR
      responses:
        '200':
          description: Check-in ou check-out confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
        '404':
          description: QR code inválido, expirado, ou aluno não inscrito no evento
        '409':
          description: Check-in já realizado
        '422':
          description: >
            QR expirado, inscrição cancelada, ou tentativa de check-out
            sem ter feito check-in antes

  # ---------------------------------------------------------------------
  # Certificados
  # ---------------------------------------------------------------------
  /inscricoes/{inscricaoId}/certificado:
    parameters:
      - name: inscricaoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Certificados]
      summary: Emite ou baixa o certificado do evento
      description: >
        Só libera o PDF se a inscrição tiver check-in, check-out e
        permanência de pelo menos 75% da duração do evento.
      responses:
        '200':
          description: Certificado em PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          description: Critérios de presença ainda não cumpridos

  # ---------------------------------------------------------------------
  # Pontuacao
  # ---------------------------------------------------------------------
  /me/pontuacao:
    get:
      tags: [Pontuacao]
      summary: Pontuação do aluno autenticado
      parameters:
        - name: periodo_id
          in: query
          description: Se omitido, retorna o período atual
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumo de pontuação do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontuacaoPeriodo'

  /pontuacao/aluno/{alunoId}/periodo/{periodoId}:
    parameters:
      - name: alunoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: periodoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Pontuacao]
      summary: Pontuação de um aluno especifico em um período (somente admin ou professor)
      description: >
        Adicionado para o painel de admin/professor consultar a
        pontuação de qualquer aluno, sem depender do token do proprio
        aluno usado em /me/pontuacao.
      responses:
        '200':
          description: Resumo de pontuação do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PontuacaoPeriodo'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Perfil:
      type: string
      # Documentado em maiusculas porque e assim que o Jackson serializa o
      # enum Java por padrao (Usuario.perfil, NovoUsuario.perfil e a claim
      # "perfil" do JWT) - o rascunho original documentava em minusculas,
      # mas nao era isso que a API implementada realmente devolvia/esperava.
      enum: [ADMIN, PROFESSOR, ALUNO]

    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/Perfil'
        rgm:
          type: string
          pattern: '^\d{8}$'
          nullable: true
          description: >
            Registro Geral do Aluno (RGM) - identificador acadêmico da
            faculdade, com 8 dígitos. Obrigatório e único quando
            perfil = aluno; não se aplica a admin/professor.
        cpf:
          type: string
          pattern: '^\d{11}$'
          nullable: true
          description: >
            CPF do professor, 11 dígitos. Obrigatório e único quando
            perfil = professor; não se aplica a admin/aluno.
        curso:
          type: string
          nullable: true
          description: >
            Curso do aluno (ex.: "Ciência da Computação") - confirmado
            com o professor que é só informativo, pra saber quais cursos
            estão participando das palestras. Não afeta pontuação,
            elegibilidade pra inscrição nem nenhuma outra regra de
            negócio - por isso texto livre, opcional, sem unicidade.
            Não se aplica a admin/professor.

    NovoUsuario:
      type: object
      required: [nome, email, perfil]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/Perfil'
        rgm:
          type: string
          pattern: '^\d{8}$'
          nullable: true
          description: >
            Obrigatório quando perfil = aluno. O OpenAPI puro não expressa
            "obrigatório somente se outro campo tiver determinado valor",
            então essa regra precisa ser validada no backend.
        cpf:
          type: string
          pattern: '^\d{11}$'
          nullable: true
          description: >
            Obrigatório quando perfil = professor, pela mesma razão do rgm
            acima - validado no backend.
        curso:
          type: string
          nullable: true
          description: Opcional, só informativo (ver descrição em Usuario.curso).

    Periodo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: "2026.1"
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date

    NovoPeriodo:
      type: object
      required: [nome, data_inicio, data_fim]
      properties:
        nome:
          type: string
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date

    Palestrante:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        bio:
          type: string

    NovoPalestrante:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        bio:
          type: string

    Evento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titulo:
          type: string
        descricao:
          type: string
        periodo_id:
          type: string
          format: uuid
          description: >
            Preenchido automaticamente pelo backend a partir da data do
            evento (ver NovoEvento) - nunca informado pelo cliente.
        local:
          type: string
        data_hora_inicio:
          type: string
          format: date-time
        data_hora_fim:
          type: string
          format: date-time
        pontos:
          type: integer
          description: >
            Pontos que o evento vale para quem cumpre os critérios de
            presença (check-in + check-out + 75% de permanência).
        palestrantes:
          type: array
          items:
            $ref: '#/components/schemas/Palestrante'

    NovoEvento:
      type: object
      required: [titulo, data_hora_inicio, data_hora_fim, pontos]
      description: >
        Sem periodo_id de proposito: o formulario ja pede data/hora do
        evento, entao o backend descobre sozinho em qual Periodo
        (semestre) cadastrado essa data cai (ver EventoService) - se
        nenhum Periodo cobrir a data, a criacao falha com 422 pedindo
        pra cadastrar um Periodo pra ela antes (POST /periodos).
      properties:
        titulo:
          type: string
        descricao:
          type: string
        local:
          type: string
        data_hora_inicio:
          type: string
          format: date-time
        data_hora_fim:
          type: string
          format: date-time
        pontos:
          type: integer
        palestrante_ids:
          type: array
          items:
            type: string
            format: uuid

    Inscricao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aluno_id:
          type: string
          format: uuid
        evento_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ativa, cancelada]
        criada_em:
          type: string
          format: date-time
        cancelada_em:
          type: string
          format: date-time
          nullable: true
        checkin:
          $ref: '#/components/schemas/Checkin'
        certificado_disponivel:
          type: boolean

    Checkin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inscricao_id:
          type: string
          format: uuid
        entrada:
          type: string
          format: date-time
        saida:
          type: string
          format: date-time
          nullable: true
        percentual_presenca:
          type: number
          format: float
          description: Calculado quando há saída registrada

    NovaSessaoCheckin:
      type: object
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [ENTRADA, SAIDA]

    SessaoCheckin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        evento_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ENTRADA, SAIDA]
        criada_em:
          type: string
          format: date-time
        expira_em:
          type: string
          format: date-time
          description: >
            Validade do QR code (6 horas após a criação) - depois disso
            o endpoint de confirmação passa a responder 422.

    PontuacaoPeriodo:
      type: object
      properties:
        periodo_id:
          type: string
          format: uuid
        periodo_nome:
          type: string
        pontos_total:
          type: integer
          description: >
            Soma dos pontos dos eventos com status "concluido", já
            descontados os pontos perdidos nos eventos com status
            "no_show" (mesmo valor de pontos do evento perdido).
        eventos:
          type: array
          items:
            type: object
            properties:
              evento_id:
                type: string
                format: uuid
              titulo:
                type: string
              pontos:
                type: integer
              status:
                type: string
                enum: [concluido, no_show, cancelado]
