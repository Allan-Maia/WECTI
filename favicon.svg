<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#080d0c">
  <!-- Head -->
  <rect x="9" y="8" width="18" height="14" rx="4" fill="none" stroke="#00e8c4" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="14" cy="14" r="2" fill="#00e8c4"/>
  <circle cx="22" cy="14" r="2" fill="#00e8c4"/>
  <!-- Eye glow -->
  <circle cx="14" cy="14" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="22" cy="14" r="1" fill="#fff" opacity="0.7"/>
  <!-- Mouth -->
  <rect x="13" y="18" width="10" height="1.5" rx="0.75" fill="#00e8c4" opacity="0.7"/>
  <!-- Antenna -->
  <line x1="18" y1="8" x2="18" y2="4" stroke="#00e8c4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="18" cy="3" r="1.5" fill="#00d4b0"/>
  <!-- Neck -->
  <rect x="16" y="22" width="4" height="2" fill="#00e8c4" opacity="0.5"/>
  <!-- Body -->
  <rect x="10" y="24" width="16" height="9" rx="3" fill="none" stroke="#00e8c4" stroke-width="1.5" opacity="0.8"/>
  <!-- Body detail -->
  <rect x="13" y="27" width="4" height="3" rx="1" fill="#00e8c4" opacity="0.3"/>
  <circle cx="24" cy="28.5" r="1.5" fill="#00e8c4" opacity="0.5"/>
  <!-- Arms -->
  <line x1="10" y1="26" x2="6" y2="29" stroke="#00e8c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="26" x2="30" y2="29" stroke="#00e8c4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
